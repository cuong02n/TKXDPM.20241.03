user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

server {
      listen 80;
      server_name aims.cuong02.com www.aims.cuong02.com


      location / {

      }


      location /api {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
      }
}



