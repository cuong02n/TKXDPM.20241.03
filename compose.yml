services: 
  database:
    image: mysql:latest
    expose:
      - 3306
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - backend
  backend:
    build: ./backend 
    environment:
      spring.datasource.url: "jdbc:mysql://database:3306/${MYSQL_DATABASE}"
      spring.mail.username: ${SMTP_GMAIL_USERNAME}
      spring.mail.password: ${SMTP_PASSWORD}
      jwt.key: ${JWT_KEY}
      spring.datasource.username: ${MYSQL_USER}
      spring.datasource.password: ${MYSQL_PASSWORD}
    expose:
      - 8080
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - frontend
  frontend:
    build: ./frontend
    environment:
      BE_HOST: "http://backend:8080"
    ports:
      - 3000:80
    depends_on:
      - backend
    networks:
      - frontend
networks:
  backend:
  frontend:
    

